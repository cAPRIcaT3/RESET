name: Generate Kelna moments and deploy

on:
  workflow_dispatch:
    inputs:
      pack_date:
        description: Optional YYYY-MM-DD (Asia/Kolkata)
        required: false
        default: ''
  schedule:
    - cron: '30 21 * * *'

# Share the deployment lock with deploy.yml so a code push cannot erase a pack.
concurrency:
  group: github-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RESET_MODEL_URL: http://127.0.0.1:11434
      RESET_MODEL_NAME: ${{ vars.RESET_MODEL_NAME || 'gemma4:e2b' }}
      RESET_KOKORO_VOICES: ${{ vars.RESET_KOKORO_VOICES || 'af_nicole,am_michael' }}
      RESET_KOKORO_SPEED: '0.94'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve pack date and cache keys
        id: config
        env:
          INPUT_DATE: ${{ inputs.pack_date }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { packContexts } from './scripts/pack-contexts.ts';
          const date = process.env.INPUT_DATE || new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          packContexts(date);
          appendFileSync(process.env.GITHUB_ENV, `RESET_PACK_DATE=${date}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `date=${date}\nmodel=${process.env.RESET_MODEL_NAME.replace(/[^a-zA-Z0-9_-]/g,'-')}\n`);
          JS
      - name: Restore Kokoro cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/onnx-community
          key: kokoro-82m-q8-${{ runner.os }}-v1
      - name: Restore Gemma cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ steps.config.outputs.model }}-${{ runner.os }}-v1
      - name: Restore this date's completed moments
        uses: actions/cache@v4
        with:
          path: public/generated
          key: kelna-pack-${{ steps.config.outputs.date }}-${{ steps.config.outputs.model }}-${{ env.RESET_KOKORO_VOICES }}-${{ hashFiles('src/narration/**', 'src/scene/**', 'scripts/*moments*', 'scripts/pack-contexts.ts', 'scripts/speech-chunks.ts', 'package-lock.json') }}
      - name: Install speech encoder and model runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve >/tmp/kelna-ollama.log 2>&1 &
          fi
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$RESET_MODEL_NAME"
      - run: npm run test:runtime
      - name: Generate and verify matching narration and recordings
        run: npm run moments:render
      - name: Keep the reviewed pack for local preview and later deployments
        uses: actions/upload-artifact@v4
        with:
          name: kelna-moments-${{ steps.config.outputs.date }}
          path: public/generated
          retention-days: 30
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy finished site
        id: deploy
        uses: actions/deploy-pages@v4
