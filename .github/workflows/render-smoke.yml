name: Kelna model and voice smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESET_MODEL_NAME: ${{ vars.RESET_MODEL_NAME || 'gemma4:e2b' }}
      RESET_MODEL_URL: http://127.0.0.1:11434
      RESET_DAILY_MODE: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Model cache key
        id: model
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'key='+process.env.RESET_MODEL_NAME.replace(/[^a-zA-Z0-9_-]/g,'-')+'\n')"
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ steps.model.outputs.key }}-${{ runner.os }}-v1
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/onnx-community
          key: kokoro-82m-q8-${{ runner.os }}-v1
      - name: Start inference runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then nohup ollama serve >/tmp/kelna-ollama.log 2>&1 & fi
          for i in {1..60}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$RESET_MODEL_NAME"
      - run: npm run moments:render
      - uses: actions/upload-artifact@v4
        with:
          name: kelna-model-smoke
          path: public/generated
          retention-days: 7
