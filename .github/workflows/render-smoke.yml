name: Model render smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESET_SCENE_PROVIDER: openai_compat
      RESET_MODEL_URL: http://127.0.0.1:11434
      RESET_MODEL_NAME: gemma3:4b
      RESET_MODEL_API_KEY: ollama
      RESET_MODEL_TIMEOUT_MS: '180000'
      RESET_DAILY_MODE: smoke
      RESET_DAILY_MAX_ATTEMPTS: '12'
      RESET_AUDIO_FORMAT: wav
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore model caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            node_modules/.cache/onnx-community
          key: reset-models-${{ runner.os }}-v1
      - name: Start Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          ollama pull gemma3:4b
      - name: Compile one RESET
        run: npm run daily:render
      - name: Upload smoke output
        uses: actions/upload-artifact@v4
        with:
          name: reset-render-smoke
          path: public/generated
          retention-days: 3
